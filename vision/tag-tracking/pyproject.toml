[project]
name = "tag-tracking"
version = "0.1.0"
description = "Virtual-field AprilTag tracking: a RoboCup proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    # PhotonVision's client library. Its version must match the PhotonVision
    # build on the coprocessor: photonlibpy refuses to talk to any other.
    "photonlibpy>=2026.3.4,<2027",
    # WPILib's AprilTagDetector -- the detector PhotonVision runs -- for the
    # frames that never pass through PhotonVision (selfcheck, synthetic camera).
    "robotpy-apriltag>=2026.2.2,<2027",
    "vision-core",
]

[project.scripts]
selfcheck = "tag_tracking.selfcheck:main"
serve-tag = "tag_tracking.serve_tag:main"
track = "tag_tracking.track:main"
calibrate-camera = "tag_tracking.calibrate_camera:main"
calibrate-field = "tag_tracking.calibrate_field:main"
photon-sim = "tag_tracking.photon_sim:main"

[tool.uv.sources]
vision-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
