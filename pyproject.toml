[project]
name = "robocup-software"
version = "0.1.0"
description = "Monorepo env: the robocup sim/strategy stack and the robocup_testing vision skills in one .venv"
# robocup_testing caps at <3.14 (pupil-apriltags has no 3.14 wheels).
requires-python = ">=3.12,<3.14"
dependencies = [
    # robocup/ (mirrors robocup/python/requirements.txt)
    "pymunk>=6.0",
    "pygame>=2.0",
    "pyzmq>=24.0",
    "numpy>=1.21",
    # robocup_testing/ skills, so their CLI entry points (track, selfcheck, ...)
    # work via `uv run` from anywhere in the repo
    "vision-core",
    "tag-tracking",
    "ball-tracking",
    "combined-tracking[zmq]",
]

[project.optional-dependencies]
# Only needed for robocup/decision_making/rl/
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
]

[tool.uv]
# Nothing to build or import here; this file only defines the environment.
package = false

# The one uv workspace for the repo: one uv.lock, one .venv, here at the root.
[tool.uv.workspace]
members = [
    "robocup_testing/vision-core",
    "robocup_testing/tag-tracking",
    "robocup_testing/ball-tracking",
    "robocup_testing/combined-tracking",
]

[tool.uv.sources]
vision-core = { workspace = true }
tag-tracking = { workspace = true }
ball-tracking = { workspace = true }
combined-tracking = { workspace = true }
