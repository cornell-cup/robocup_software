[project]
name = "robocup-software"
version = "0.1.0"
description = "Monorepo env: the simulator, strategy, vision tracking, web app and robot driver in one .venv"
# The <3.14 cap dates from pupil-apriltags, which is gone; photonlibpy resolves
# on 3.14 too. Lift it once the rest of the stack (pygame, pymunk, torch) is
# checked there.
requires-python = ">=3.12,<3.14"
dependencies = [
    # sim/ and strategy/ (mirrors sim/requirements.txt)
    "pymunk>=6.0",
    "pygame>=2.0",
    "pyzmq>=24.0",
    "numpy>=1.21",
    # vision/ packages, so their CLI entry points (track, selfcheck, ...)
    # work via `uv run` from anywhere in the repo
    "vision-core",
    "tag-tracking",
    "ball-tracking",
    "combined-tracking[zmq]",
    # app/server: the web app (`uv run robocup-web`)
    "robocup-web",
    # robot/: drive a real XRP robot over Bluetooth, and flash its firmware
    # (mirrors robot/laptop/requirements.txt; pygame is above). bleak is held to
    # the 1.x line the robot code was tested on.
    "bleak>=1.1.1,<2",
    "mpremote>=1.29",
]

[project.optional-dependencies]
# Only needed for strategy/rl/
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
]

[tool.uv]
# Nothing to build or import here; this file only defines the environment.
package = false

# The one uv workspace for the repo: one uv.lock, one .venv, here at the root.
[tool.uv.workspace]
members = [
    "vision/vision-core",
    "vision/tag-tracking",
    "vision/ball-tracking",
    "vision/combined-tracking",
    "app/server",
]

[tool.uv.sources]
vision-core = { workspace = true }
tag-tracking = { workspace = true }
ball-tracking = { workspace = true }
combined-tracking = { workspace = true }
robocup-web = { workspace = true }
