[project]
name = "robocup-software"
version = "0.1.0"
description = "Monorepo env: the robocup sim/strategy stack and the robocup_testing vision skills in one .venv"
# robocup_testing caps at <3.14 (pupil-apriltags has no 3.14 wheels).
requires-python = ">=3.12,<3.14"
dependencies = [
    # robocup/ (mirrors robocup/python/requirements.txt)
    "pymunk>=6.0",
    "pygame>=2.0",
    "pyzmq>=24.0",
    "numpy>=1.21",
    # robocup_testing/ skills, editable, so their CLI entry points land on PATH
    "vision-core",
    "tag-tracking",
    "ball-tracking",
    "combined-tracking[zmq]",
]

[project.optional-dependencies]
# Only needed for robocup/decision_making/rl/
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
]

[tool.uv]
# Nothing to build or import here; this file only defines the environment.
package = false

# Path deps rather than a workspace: robocup_testing/ is already its own uv
# workspace (and a git subtree), and uv does not nest workspaces.
[tool.uv.sources]
vision-core = { path = "robocup_testing/vision-core", editable = true }
tag-tracking = { path = "robocup_testing/tag-tracking", editable = true }
ball-tracking = { path = "robocup_testing/ball-tracking", editable = true }
combined-tracking = { path = "robocup_testing/combined-tracking", editable = true }
